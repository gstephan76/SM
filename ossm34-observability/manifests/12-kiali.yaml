apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  auth:
    strategy: openshift
  deployment:
    logger:
      log_level: info
    replicas: 1
    view_only_mode: false
  istio_namespace: istio-system
  version: default
  external_services:
    grafana:
      enabled: false
    prometheus:
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      auth:
        type: bearer
        use_kiali_token: true
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        insecure_skip_verify: false
      thanos_proxy:
        enabled: true
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      internal_url: https://tempo-mesh-gateway.tempo.svc.cluster.local:8080/api/traces/v1/mesh/tempo
      auth:
        type: bearer
        use_kiali_token: true
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        insecure_skip_verify: false
