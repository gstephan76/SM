apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  version: v1.30.3
  updateStrategy:
    type: InPlace
    inactiveRevisionDeletionGracePeriodSeconds: 30
  values:
    meshConfig:
      discoverySelectors:
      - matchLabels:
          istio-discovery: enabled
      enableTracing: true
      extensionProviders:
      - name: otel-tracing
        opentelemetry:
          service: otel-collector.istio-system.svc.cluster.local
          port: 4317
