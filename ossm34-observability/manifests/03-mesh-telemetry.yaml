apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-observability
  namespace: istio-system
spec:
  metrics:
  - providers:
    - name: prometheus
  tracing:
  - providers:
    - name: otel-tracing
    # Commissioning baseline. Re-size from traffic volume and retention budget.
    randomSamplingPercentage: 10.0
