apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  version: v1.31-latest
  profile: ambient
  values:
    global:
      nativeNftables: true
    pilot:
      trustedZtunnelNamespace: ztunnel
      env:
        ENABLE_INGRESS_WAYPOINT_ROUTING: "true"
    meshConfig:
      discoverySelectors:
      - matchLabels:
          istio-discovery: enabled
      enableTracing: true
      extensionProviders:
      - name: otel-tracing
        opentelemetry:
          service: otel-collector.istio-system.svc.cluster.local
          port: 4317
