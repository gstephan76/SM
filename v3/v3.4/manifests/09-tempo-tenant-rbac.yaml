apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-mesh-traces-writer
rules:
- apiGroups: ["tempo.grafana.com"]
  resources: ["mesh"]
  resourceNames: ["traces"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-mesh-traces-reader
rules:
- apiGroups: ["tempo.grafana.com"]
  resources: ["mesh"]
  resourceNames: ["traces"]
  verbs: ["get"]
