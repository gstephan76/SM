apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-mesh-traces-writer
rules:
- apiGroups: ["tempo.grafana.com"]
  resources: ["mesh"]
  resourceNames: ["traces"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempo-mesh-traces-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-mesh-traces-writer
subjects:
- kind: ServiceAccount
  name: otel-collector
  namespace: istio-system
