apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookinfo-route
  namespace: bookinfo
spec:
  parentRefs:
    - name: bookinfo-mesh-gateway
  hostnames:
    - "bookinfo.apps.cluster-l6fjm.dyn.redhatworkshops.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: productpage
          port: 9080
