apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.apps.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls-cert
      allowedRoutes:
        namespaces:
          from: All
