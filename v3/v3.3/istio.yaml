apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  annotations:
  name: default
spec:
  namespace: istio-system
  updateStrategy:
    inactiveRevisionDeletionGracePeriodSeconds: 30
    type: InPlace
  values:
    meshConfig:
      defaultProviders:
        metrics:
          - prometheus
        tracing:
          - otel-tracing
      discoverySelectors:
        - matchLabels:
            istio-discovery: enabled
      enableTracing: true
      extensionProviders:
        - name: otel-tracing
          opentelemetry:
            port: 4317
            service: otel-collector.istio-system.svc.cluster.local
  version: v1.28.4
